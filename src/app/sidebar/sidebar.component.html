<!-- Favicons -->
<link rel="apple-touch-icon" href="/docs/5.0/assets/img/favicons/apple-touch-icon.png" sizes="180x180">
<link rel="icon" href="/docs/5.0/assets/img/favicons/favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/docs/5.0/assets/img/favicons/favicon-16x16.png" sizes="16x16" type="image/png">
<link rel="manifest" href="/docs/5.0/assets/img/favicons/manifest.json">
<link rel="mask-icon" href="/docs/5.0/assets/img/favicons/safari-pinned-tab.svg" color="#7952b3">
<link rel="icon" href="/docs/5.0/assets/img/favicons/favicon.ico">
<meta name="theme-color" content="#7952b3">

<main>
    <div class="flex flex-col shrink-0 h-full w-[72px] md:w-[280px] px-[10px] md:px-[16px] py-[16px] text-white bg-brand-navy transition-[width] duration-200">
        <a routerLink="/" class="flex items-center justify-center md:justify-start text-white no-underline" title="ZM Transport">
            <span class="text-2xl font-bold md:hidden">ZM</span>
            <span class="hidden md:inline fs-4">ZM Transport</span>
        </a>
        <hr>
        <ul class="nav nav-pills flex-column mb-auto">
            @for (item of items(); track item.route) {
            <li class="nav-item my-1">
                <a [routerLink]="item.route" routerLinkActive="bg-sky-950" [title]="item.title"
                    class="flex items-center justify-center md:justify-start gap-3 rounded p-2 text-white no-underline hover:bg-sky-900">
                    <img class="block shrink-0 p-1 bg-light rounded" [src]="item.imageUrl" [alt]="item.title" width="30" height="30">
                    <span class="hidden md:inline leading-none">{{ item.title }}</span>
                </a>
            </li>
            }
        </ul>
        <hr>
        <div>
            @if (currentUser(); as user) {
            <p class="hidden md:block text-white-50 small mb-2 truncate">{{ user.name }}</p>
            }
            <button type="button" (click)="logout()" title="Cerrar sesión" aria-label="Cerrar sesión"
                class="btn btn-outline-light w-100 fw-bold flex items-center justify-center gap-2">
                <svg class="h-5 w-5 md:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span class="hidden md:inline">Cerrar sesión</span>
            </button>
        </div>
    </div>
    <div class="b-example-divider"></div>
</main>
